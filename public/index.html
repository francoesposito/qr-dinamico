<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Dinámico</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #0F172A;
      --primary-hover: #1E293B;
      --accent: #3B82F6;
      --accent-hover: #2563EB;
      --bg-color: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --border-color: #E2E8F0;
      --success: #10B981;
      --error: #EF4444;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      box-shadow: var(--shadow-lg);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .container.wide {
      max-width: 600px;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), #60A5FA);
    }

    .icon-wrapper {
      width: 64px;
      height: 64px;
      background-color: #EFF6FF;
      color: var(--accent);
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 1.5rem;
    }

    .icon-wrapper svg { width: 32px; height: 32px; }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.025em;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }

    .form-group {
      text-align: left;
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }

    input[type="url"], input[type="text"], input[type="number"], input[type="password"] {
      width: 100%;
      padding: 0.875rem 1rem;
      font-size: 1rem;
      font-family: inherit;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background-color: #F8FAFC;
      transition: all 0.2s ease;
      color: var(--text-main);
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      background-color: #FFFFFF;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
    }

    button {
      width: 100%;
      padding: 0.875rem;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    button:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled { background-color: #94A3B8; cursor: not-allowed; transform: none; }

    /* Loader */
    .loader {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    button.loading .loader { display: block; }
    button.loading span { display: none; }

    /* Message box */
    .message-box {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 500;
      display: none;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
      text-align: center;
    }

    .message-box.show { display: block; opacity: 1; transform: translateY(0); }
    .message-box.success { background-color: #ECFDF5; color: #065F46; border: 1px solid #A7F3D0; }
    .message-box.error { background-color: #FEF2F2; color: #991B1B; border: 1px solid #FECACA; }

    .view-section { display: none; }
    .view-section.active { display: block; animation: fadeIn 0.4s ease forwards; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Links List Area */
    .links-list {
      margin-top: 2rem;
      text-align: left;
      display: none;
    }
    .links-list.show { display: block; }
    
    .link-item {
      background-color: #F8FAFC;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 0.5rem;
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .link-item button {
      width: auto;
      margin: 0;
      padding: 0.4rem 0.8rem;
      font-size: 0.75rem;
      background-color: #E2E8F0;
      color: var(--text-main);
    }
    .link-item button:hover {
      background-color: #CBD5E1;
    }

  </style>
</head>
<body>

  <div class="container" id="main-container">
    
    <!-- 1. VISTA DE CONFIGURACIÓN DE QR -->
    <div id="setup-view" class="view-section">
      <div class="icon-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m13.35-.622l1.757-1.757a4.5 4.5 0 00-6.364-6.364l-4.5 4.5a4.5 4.5 0 001.242 7.244" />
        </svg>
      </div>
      
      <h1>Configurar Destino</h1>
      <p>Asigna la URL a la que deseas que este código QR redirija cuando sea escaneado.</p>
      
      <form id="setupForm">
        <div class="form-group">
          <label for="urlInput">URL de Destino</label>
          <input type="url" id="urlInput" placeholder="https://www.ejemplo.com" required autocomplete="off">
        </div>
        
        <button type="submit" id="setupSubmitBtn">
          <span>Guardar Enlace</span>
          <div class="loader"></div>
        </button>
      </form>
    </div>

    <!-- 2. VISTA DE ADMINISTRADOR (Generador) -->
    <div id="admin-view" class="view-section">
      <div class="icon-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
      </div>
      
      <h1>Generador de Packs</h1>
      <p>Crea lotes de QRs dinámicos listos para imprimir.</p>
      
      <form id="adminForm">
        <div class="form-group">
          <label for="prefixInput">Prefijo</label>
          <input type="text" id="prefixInput" placeholder="Ej: PACK1" required autocomplete="off">
        </div>
        <div class="form-group">
          <label for="countInput">Cantidad</label>
          <input type="number" id="countInput" placeholder="Ej: 10" min="1" max="100" required>
        </div>
        <div class="form-group">
          <label for="passwordInput">Contraseña Maestra</label>
          <input type="password" id="passwordInput" placeholder="Contraseña Maestra" required>
        </div>
        
        <button type="submit" id="adminSubmitBtn">
          <span>Generar QRs</span>
          <div class="loader"></div>
        </button>
      </form>

      <!-- Lista de URLs generadas -->
      <div id="generated-links" class="links-list">
        <label>Enlaces Generados (Listos para copiar)</label>
        <div id="links-container"></div>
      </div>
    </div>

    <!-- 3. ESTADO DE ÉXITO (Para el setup) -->
    <div id="success-view" class="view-section">
      <div class="icon-wrapper" style="background-color: #ECFDF5; color: var(--success);">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <h1>¡Listo!</h1>
      <p>Este código QR ahora redirigirá automáticamente a tu enlace. Los cambios ya están activos.</p>
    </div>

    <!-- MENSAJES GLOBALES -->
    <div id="messageBox" class="message-box"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      
      // Elementos de la UI
      const mainContainer = document.getElementById('main-container');
      const setupView = document.getElementById('setup-view');
      const adminView = document.getElementById('admin-view');
      const successView = document.getElementById('success-view');
      const messageBox = document.getElementById('messageBox');
      
      // Lógica de ruteo SPA
      const path = window.location.pathname;
      let qrId = null;

      if (path.startsWith('/qr/')) {
        // Modo Configuración
        setupView.classList.add('active');
        const parts = path.split('/');
        qrId = parts[parts.length - 1];
        if(!qrId) qrId = 'test-id';
      } else {
        // Modo Admin (Raíz)
        adminView.classList.add('active');
        mainContainer.classList.add('wide'); // Hacemos el modal un poco más ancho para la lista
      }

      // Utilidad para mostrar mensajes
      function showMessage(msg, type) {
        messageBox.textContent = msg;
        messageBox.className = `message-box ${type} show`;
        if(type === 'error') {
          setTimeout(() => messageBox.classList.remove('show'), 4000);
        }
      }

      // ----------------------------------------------------
      // Lógica: Vista de Configuración (Setup)
      // ----------------------------------------------------
      const setupForm = document.getElementById('setupForm');
      const setupSubmitBtn = document.getElementById('setupSubmitBtn');

      setupForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const targetUrl = document.getElementById('urlInput').value.trim();
        if (!targetUrl) return;

        if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
          showMessage('La URL debe comenzar con http:// o https://', 'error');
          return;
        }

        setupSubmitBtn.disabled = true;
        setupSubmitBtn.classList.add('loading');
        messageBox.classList.remove('show');

        try {
          const response = await fetch('/api/qr/setup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ qrId, targetUrl })
          });
          const data = await response.json();

          if (response.ok && data.success) {
            setupView.classList.remove('active');
            successView.classList.add('active');
          } else {
            showMessage(data.message || 'Error al configurar el QR.', 'error');
          }
        } catch (error) {
          showMessage('Error de conexión.', 'error');
        } finally {
          setupSubmitBtn.disabled = false;
          setupSubmitBtn.classList.remove('loading');
        }
      });

      // ----------------------------------------------------
      // Lógica: Vista de Administrador (Generador)
      // ----------------------------------------------------
      const adminForm = document.getElementById('adminForm');
      const adminSubmitBtn = document.getElementById('adminSubmitBtn');
      const generatedLinksSection = document.getElementById('generated-links');
      const linksContainer = document.getElementById('links-container');

      adminForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const prefix = document.getElementById('prefixInput').value.trim();
        const count = parseInt(document.getElementById('countInput').value, 10);
        const password = document.getElementById('passwordInput').value;

        if (!prefix || !count || !password) return;

        adminSubmitBtn.disabled = true;
        adminSubmitBtn.classList.add('loading');
        messageBox.classList.remove('show');
        generatedLinksSection.classList.remove('show');

        try {
          const response = await fetch('/api/admin/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prefix, count, password })
          });
          const data = await response.json();

          if (response.ok && data.success) {
            showMessage('QRs generados en la base de datos.', 'success');
            
            // Limpiar contenedor previo
            linksContainer.innerHTML = '';
            
            // Dibujar lista
            data.urls.forEach(url => {
              const div = document.createElement('div');
              div.className = 'link-item';
              
              const span = document.createElement('span');
              span.textContent = url;
              
              const copyBtn = document.createElement('button');
              copyBtn.type = 'button';
              copyBtn.textContent = 'Copiar';
              copyBtn.onclick = () => {
                navigator.clipboard.writeText(url);
                copyBtn.textContent = '¡Copiado!';
                setTimeout(() => copyBtn.textContent = 'Copiar', 2000);
              };

              div.appendChild(span);
              div.appendChild(copyBtn);
              linksContainer.appendChild(div);
            });

            generatedLinksSection.classList.add('show');
            document.getElementById('passwordInput').value = ''; // Limpiar contraseña por seguridad
          } else {
            // Manejo de Error 401 y otros
            showMessage(data.message || 'Error al generar los QRs.', 'error');
            if (response.status === 401) {
              document.getElementById('passwordInput').focus();
            }
          }
        } catch (error) {
          showMessage('Error de conexión al servidor.', 'error');
        } finally {
          adminSubmitBtn.disabled = false;
          adminSubmitBtn.classList.remove('loading');
        }
      });
    });
  </script>
</body>
</html>
